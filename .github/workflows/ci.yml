name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: autodrive
          POSTGRES_PASSWORD: autodrive_ci
          POSTGRES_DB: autodrive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://autodrive:autodrive_ci@localhost:5432/autodrive_test
      JWT_SECRET_KEY: ci-only-secret-key-for-autodrive-tests
      CORS_ORIGINS: http://localhost:3000

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.4"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: pip install -r requirements-dev.txt

      - name: Validate Python syntax
        run: python -m py_compile main.py auth.py database.py models.py schemas.py

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Verify migration metadata
        run: alembic check

      - name: Run backend integration tests
        run: pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js application
        run: npm run build
